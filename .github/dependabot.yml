version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # setuptools 83+ needs Python 3.10; keep Python 3.9 support.
    ignore:
      - dependency-name: setuptools
        versions: [">=83"]
        # Keep the tested build minimum; security updates still apply.
        update-types: ["version-update:semver-major"]
    groups:
      compatible-build-tools:
        update-types: [minor, patch]
