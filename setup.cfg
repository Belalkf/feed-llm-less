[metadata]
name = feed-llm-less
version = attr: feed_llm_less.__version__
description = Help your coding agent choose which files to read first
url = https://github.com/Belalkf/feed-llm-less
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
project_urls =
    Source = https://github.com/Belalkf/feed-llm-less
    Issues = https://github.com/Belalkf/feed-llm-less/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Operating System :: MacOS
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: Software Development :: Quality Assurance

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = feed_llm_less*

[options.package_data]
feed_llm_less = *.html, *.css, *.js

[options.entry_points]
console_scripts =
    feed-llm-less = feed_llm_less.cli:entrypoint
